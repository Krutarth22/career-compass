# skillpath skill taxonomy registry
#
# See skill-taxonomy.md in this directory for the full explanation of how this
# file is used and enforced. Summary: this is the canonical list of skill IDs
# that templates (Task 7) and resolution.py (Task 4) are allowed to reference.
#
# Schema per entry:
#   id: string            # canonical, kebab-case, stable identifier
#   display_name: string  # human-readable name shown in reports/roadmaps
#   synonyms: [string]    # alternate phrasings that resolve to this id
#
# Do not hand-edit this file to auto-absorb live-research output; see
# skill-taxonomy.md for the enforcement rules and the human-in-the-loop
# process for adding new entries.

