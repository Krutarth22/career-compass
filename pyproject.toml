[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-compass"
version = "0.1.0"
description = "A Claude Code and Codex skill for career path planning and skill development"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "python-docx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = []
